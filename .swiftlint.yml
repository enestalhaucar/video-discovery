included:
  - VideoDiscovery
  - VideoDiscoveryTests

excluded:
  - build

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  excluded:
    - id

type_body_length:
  warning: 250

file_length:
  warning: 400
